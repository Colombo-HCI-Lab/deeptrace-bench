notes: The cross-dataset benchmark every video detector here reports (SBI, UCF, Effort, GenD), so it anchors reproduction for models whose only other reference is FF++. 890 real and 5,639 fake videos of 59 celebrities, mostly Caucasian; no South Asian signal. Obtained 2026-11-26 as a 9.3 GB zip, 6,529 videos, 518 in the official test list (178 real, 340 fake).
