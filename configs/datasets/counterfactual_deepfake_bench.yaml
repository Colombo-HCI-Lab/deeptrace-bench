notes: 7,056 fully synthetic talking-head clips in 56 prompted cells, seven perceived-race groups (Black, East Asian, Indian, Latino, MENA, Southeast Asian, White) by two genders and four age bands, from four text-to-video generators (LTX 2.3 and 2.5 with audio, Wan 2.2, HunyuanVideo 1.5). The only open set with an explicit Indian cell, so it asks whether the miss rate changes with the face alone, same generator and same prompt. The people are synthetic and the labels are prompted presentation, not self-reported. Its real half (CelebV-HQ, FairFace labels) isn't redistributed, so an evalset pairs the fakes with reals from another corpus (the authors used CelebV-HQ). Ungated on the Hub, checked 2026-10-28; 6,435 clips pass the authors' QC (split primary), about 4.6 GB of clips (checked 2026-11-28).
