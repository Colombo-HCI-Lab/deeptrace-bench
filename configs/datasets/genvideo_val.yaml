notes: The validation split of GenVideo (Chen et al., DeMamba, 2024), the set DeMamba's checkpoint card and D3's paper report, so it is where both reproduce. 10,000 real MSR-VTT videos and 8,584 fakes from ten text- and image-to-video generators (Crafter, Gen2, HotShot, Lavie, ModelScope, MoonValley, MorphStudio, Show_1, Sora, WildScrape), as one 13.9 GB zip (listed by range reads 2026-11-28). Generic scenes, not faces, and no South Asian signal.
