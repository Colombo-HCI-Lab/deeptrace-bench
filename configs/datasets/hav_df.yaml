notes: Kaur et al., arXiv 2411.15457 (2024, preprint). 508 videos per the paper (200 real, 308 fake), 15 s at 1080p; fakes are face swaps (FSGAN, FaceSwap, DeepFaceLab), ReTalking lip-sync and RVC voice cloning, split by which track is fake (78 fake audio only, 130 fake video only, 100 both). A later paper reports far larger splits, so the released size is unverified (checked 2026-10-28). The Hindi audio-visual set to sit beside MAVOS-DD's Hindi. No builder until the files are seen.
