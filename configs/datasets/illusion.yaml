notes: Thakral et al., ICLR 2025 (OpenReview; not on arXiv). 1.38M samples over face swap, reenactment, lip-sync, talking heads, TTS and fully generated media. Set D, 4,385 real-world samples, covers Hindi, Tamil, Kannada, Oriya, Punjabi, Gujarati and Sanskrit, the widest Indic coverage of any video set found (checked 2026-10-28). Set A has Fitzpatrick skin-tone bins but no ethnicity label. Same lab as DeePhy and DF-Platter, so one request may cover all three.
