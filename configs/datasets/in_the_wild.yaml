notes: 31,779 clips (19,963 bona fide, 11,816 spoof) of 54 public figures, labels in meta.csv; checked 2026-10-05. The zip is read from the Hugging Face repo at a pinned revision, by range requests when sampling. Not South Asian; it is where audio models trained on ASVspoof 2019 report generalisation, so it anchors reproduction for models that saw ASVspoof 2019 eval.
