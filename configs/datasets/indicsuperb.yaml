notes: Real counterpart for IndicSynth, which was generated from these speakers. Only the clean test splits are fetched (5.8 GB); the 85 GB train split is left out until needed. Plain tars, so the dataset is downloaded in full and samples come from that copy (builder written 2026-10-05). Audio is m4a, decoded by the audio loader. The licence is the Hugging Face card's; the object store states none.
