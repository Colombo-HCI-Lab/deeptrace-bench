notes: Fake only (XTTS-v2, VITS, FreeVC24), audio embedded in parquet shards (builder written 2026-10-05; a sample reads two shards' labels and one row group of each). Default download is Hindi (56 GB), Bengali (34 GB) and Urdu (38 GB); Tamil alone is 148 GB. The manifest builder writes each clip out as a WAV beside the shards, so a language takes about twice its download on disk (Hindi 107 GB, checked 2026-10-19). Real speech comes from IndicSUPERB, its source corpus.
