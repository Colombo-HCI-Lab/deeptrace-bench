id: indicsynth
name: IndicSynth
modality: audio
role: south_asian
status: open
access:
  kind: hf
  page: https://huggingface.co/datasets/vdivyasharma/IndicSynth
  repo: vdivyasharma/IndicSynth
  allow_patterns: [README.md]
  language_patterns:
    hi: [Hindi/*]
    bn: [Bengali/*]
    ur: [Urdu/*]
    ta: [Tamil/*]
    mr: [Marathi/*]
    kn: [Kannada/*]
    ml: [Malayalam/*]
    gu: [Gujarati/*]
    pa: [Punjabi/*]
    te: [Telugu/*]
    or: [Odia/*]
    sa: [Sanskrit/*]
  default_languages: [hi, bn, ur]
licence: CC BY-NC 4.0
licence_terms:
  - Non-commercial use only.
contains: [fake]
languages: [hi, bn, ur, ta, mr, kn, ml, gu, pa, te, or, sa]
size_gb: 845
derived_from: [indicsuperb]
builder: deeptrace_bench.datasets.indicsynth:build_manifest
notes: Fake only (XTTS-v2, VITS, FreeVC24), audio embedded in parquet shards. Default download is Hindi (56 GB), Bengali (34 GB) and Urdu (38 GB); Tamil alone is 148 GB. Real speech comes from IndicSUPERB, its source corpus.
