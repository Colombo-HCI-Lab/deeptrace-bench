notes: Real and TTS speech in 16 Indian languages, Nepali among them, from a Hugging Face community challenge (checked 2026-10-05). Only the labelled train split (31,102 clips) is fetched; the test split's labels are hidden. The card names neither the TTS system nor where the real speech comes from; the ids point to a studio emotional-speech corpus with one female and one male voice per Indian language, and the English rows include LJSpeech and LibriSpeech. Open, no gate, audio embedded in parquet.
