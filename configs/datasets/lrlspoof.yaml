notes: Deferred. Spoofed speech only, 1.3 million utterances in 66 languages (Interspeech 2026, arXiv 2603.02364; checked 2026-10-05), including Nepali - the only Nepali spoofs besides the IndicTTS challenge set - and Assamese, Bodo, Manipuri and Rajasthani. One gzipped tarball in 47 parts of 10 GiB, so no language can be fetched alone; worth it only if Nepali needs more than the IndicTTS challenge set gives.
