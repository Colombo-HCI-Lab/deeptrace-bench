notes: The language control for MAVOS-DD Hindi (added 2026-11-08). 4,366 real and 5,935 fake German videos from the same eight generators as the Hindi subset plus freevc (voice conversion, 200), so a drop from German to Hindi on the same generators points at language and faces rather than the kind of fake. The smallest of MAVOS-DD's languages that has every Hindi generator (English is 47.8 GB). Not South Asian, never a headline number. Real videos come from YouTube.
