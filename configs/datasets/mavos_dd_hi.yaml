notes: The only downloadable South Asian audio-video deepfake set found (2026-10-05). 3,632 real and 3,881 fake Hindi videos from eight generators, most of them talking-head and lip-sync, which is v1's focus. Real videos come from YouTube, which isn't listed in derived_from because it names no particular videos. No speaker, ethnicity or skin-tone labels. Whether the face-swap and talking-head videos keep their original audio is unknown until the metadata can be read.
