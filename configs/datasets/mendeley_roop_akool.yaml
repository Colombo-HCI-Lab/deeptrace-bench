notes: >-
  Pipeline test only, never reported. Face-crop frames (500 x 500 JPEG), not videos: 3,746
  real frames from 30 videos and 106,948 fake frames from 450, made with Roop and Akool;
  Bangladeshi and Indian subjects; collected with ethical approval from Daffodil
  International University. One 4.1 GB ZIP64; the host (S3 behind a redirect) supports HTTP
  range requests, so --sample reads only the members it needs. Some source clips came from
  YouTube; not listed in derived_from because "youtube" names no particular videos. Checked
  2026-10-04.
