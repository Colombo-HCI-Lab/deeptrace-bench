notes: The largest labelled Hindi and Tamil spoof set (arXiv 2509.19865; checked 2026-10-05) - Hindi 71,171 and Tamil 49,640 utterances among seven languages, with ten named generators (VITS-MMS, FastSpeech2, Indic-TTS, F5-TTS, Tacotron2, FastPitch, and the commercial HeyGen, ElevenLabs, MiniMax and GPT-4o-mini-TTS) and speakers per row. Real speech is Common Voice plus Indic speech corpora. Parquet shards; only Hindi and Tamil are wanted.
