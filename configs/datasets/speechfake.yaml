notes: SpeechFake (ACL 2025, ModelScope; checked 2026-10-05) in its South Asian languages - Hindi as Edge-TTS (15,382 clips) and SeedVC voice conversion (14,633, LibriTTS speech converted to Common Voice Hindi voices), Bengali, Tamil and Marathi as Edge-TTS (20,000 each), Malayalam (3,726), and 4,630 real Common Voice Hindi clips from its own real part; no Urdu, Nepali or Sinhala. The multilingual part is one 123 GB split zip, sampled by range reads of its 179 MB central directory and single members, so samples need only range reads; a full fetch downloads the 116 GB of parts, extracts the South Asian 8 GB (93,741 clips) and deletes the parts, then adds Common Voice's 21 GB zip.
