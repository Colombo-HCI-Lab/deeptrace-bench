# The one evaluation setup every run uses. Changing anything here changes every run id, so
# results from different settings never mix (see runs.py).
#
# status: proposed until the team settles decision 5 (due 2026-10-09). Once settled, switch
# to `settled` and treat changes as a new benchmark version.
status: proposed

video:
  face_detector: scrfd_10g         # configs/tools/; run once per dataset, detections cached
  detector_input_size: 640         # letterboxed square input, as GenD's detector.py uses
  det_threshold: 0.4               # detector.py's default; GenD's README preprocesses at 0.1
  nms_threshold: 0.4
  face_choice: largest             # one face per frame: the largest box
  frames_per_clip: 32
  frame_sampling: uniform
  crop: per_model                  # each model's config carries its CropSpec
  min_face_frames: 8               # video: fewer frames with a face than this: status no_face
  image_min_face_frames: 1         # an image is a one-frame clip
  image_pad_retry: 0.5             # no face in an image: detect again with a black border of
                                   # this fraction per side (tight face crops defeat SCRFD)
  video_pad_retry: 0.5             # the same for a video frame: HiDF's videos are 512 px face
                                   # crops, and without it SCRFD found faces in 6 of 32 frames
  aggregation: mean                # item score = mean of frame scores

audio:
  sample_rate: 16000
  segment_samples: 64600           # ~4 s, what AASIST and XLS-R + AASIST were trained on
  min_seconds: 1.0                 # shorter clips: status too_short, not tiled
  aggregation: mean                # item score = mean of window scores

compute:
  tf32: false                      # CUDA in fp32: cuDNN's default TF32 convolutions moved DF
                                   # Arena's scores up to 2.5e-2 from CPU, beyond parity's 1e-3

metrics:
  primary: [auc, eer]
  bootstrap:
    n: 1000
    ci: 0.95
    seed: 0
  min_group_n: 30                  # groups with fewer real or fake items are flagged small
  threshold: overall_eer           # one global threshold for per-group FPR and FNR
  fixed_fpr_reference: 0.05        # also report the fake detection rate at 5% FPR

reporting:
  headline_pairing: same_corpus    # cross-corpus evalsets never enter headline numbers
  allowed_verdicts: [clean, source_overlap, overlap_excluded]
  attribute_rule:                  # decision 4 (proposed): keep a dictionary field if
    metric: auc                    # both models in a modality shift by this much
    min_shift: 0.05
    models_agree: 2
