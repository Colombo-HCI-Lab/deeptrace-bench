id: aasist3
name: AASIST3
modality: audio
status: workable
licence: CC BY-NC-ND 4.0 (repo LICENSE; the model card says CC BY-NC 4.0)
paper: Borodin et al., 2024
upstream:
  repo: lab260ru/AASIST3
  commit: 33c39c24525c871225ad3abe3c8ec3b0e1ce86de
weights:
  - name: aasist3.safetensors     # the Hub's model.safetensors, under its own name
    kind: hf
    repo: lab260/AASIST3
    filename: model.safetensors
    revision: f0e9f100b670c6bc7e0d373a778e375afeaf057b
    size_bytes: 1287120456
  - name: aasist3_config.json
    kind: hf
    repo: lab260/AASIST3
    filename: config.json
    revision: f0e9f100b670c6bc7e0d373a778e375afeaf057b
  # The front end's architecture, which upstream fetches unpinned; its weights are in the
  # checkpoint.
  - name: xlsr-53-config
    kind: hf_snapshot
    repo: facebook/wav2vec2-large-xlsr-53
    revision: c3f9d884181a224a6ac87bf8885c84d1cff3384f
    allow_patterns: [config.json]
training_data:
  - {dataset: commonvoice, level: pretrain, note: "XLSR-53 pretraining"}
  - {dataset: babel, level: pretrain, note: "XLSR-53 pretraining"}
  - {dataset: mls, level: pretrain, note: "XLSR-53 pretraining"}
  - {dataset: asvspoof2019_la, level: train, split: train}
  - {dataset: asvspoof5, level: train}
  - {dataset: mlaad, level: train}
  - {dataset: m_ailabs, level: train}
adapter: deeptrace_bench.models.aasist3:AASIST3Detector
input:
  sample_rate: 16000
  segment_samples: 64600
  model_config: aasist3_config.json
  backbone_config: xlsr-53-config
  fake_index: 0                   # upstream labels spoof 0 and scores outputs[:, 1]
notes: A weak multilingual-trained baseline, not a strong one. The repo says the released weights are not the paper's, and the Speech DF Arena measures them at 28 to 32% EER on In-the-Wild and ASVspoof 2021 (9.4% on ASVspoof 2019 LA). Trained on MLAAD, so refused on mlaad_*. The Hub repo now points to lab260/Spectra-AASIST3, whose training data isn't published, so that one stays out. Adapter written 2026-10-05; parity runs in our own environment (transformers-native) but isn't run yet, and the README contradicts the code on which logit is bona fide, so the direction needs its check.
