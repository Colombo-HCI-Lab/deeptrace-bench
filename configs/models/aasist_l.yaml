id: aasist_l
name: AASIST-L
modality: audio
status: ready
wave: 1
licence: MIT
paper: Jung et al., ICASSP 2022
upstream:
  repo: clovaai/aasist
  commit: a04c9863f63d44471dde8a6abcb3b082b07cd1d1
weights:
  - name: AASIST-L.pth
    kind: github_raw
    url: https://raw.githubusercontent.com/clovaai/aasist/a04c9863f63d44471dde8a6abcb3b082b07cd1d1/models/weights/AASIST-L.pth
    size_bytes: 426428
training_data:
  - {dataset: asvspoof2019_la, level: train, split: train}
adapter: deeptrace_bench.models.aasist:AASISTDetector
input:
  variant: AASIST-L
  sample_rate: 16000
  segment_samples: 64600
  fake_index: 0      # upstream labels bona fide 1; confirmed on asvspoof2019_la_eval
notes: Score direction settled 2026-10-05 on a seeded sample of ASVspoof 2019 LA eval (186 real, 187 fake) - AUC 0.999, EER 1.1% (paper 0.99%) with P(fake) at softmax index 0. Issue 17's inverted outputs come from reading upstream's bona fide logit as a fake score. Full-eval reproduction waits for the full download.
