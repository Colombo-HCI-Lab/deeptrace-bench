id: core
name: CORE (DeepfakeBench)
modality: video
status: workable
licence: CC BY-NC 4.0 (DeepfakeBench)
paper: "Ni et al., CORE: Consistent Representation Learning for Face Forgery Detection, CVPRW 2022"
upstream:
  repo: SCLBD/DeepfakeBench
  commit: f188b1c105465e2e5377eb536a95022ae0e4522d
weights:
  - name: core_best.pth
    kind: github_release
    url: https://github.com/SCLBD/DeepfakeBench/releases/download/v1.0.1/core_best.pth
training_data:
  - {dataset: imagenet, level: pretrain}
  - {dataset: ffpp, level: train, split: train, note: "c23 per the DeepfakeBench README"}
adapter: deeptrace_bench.models.deepfakebench:DeepfakeBenchDetector
input:
  detector: core
  crop: {size: 256, margin: 1.3, align: five_point}
  frames_per_clip: 32
notes: Xception trained for representations that stay consistent across augmentations. Release v1.0.1 weights, added 2026-10-05; parity not run yet.
