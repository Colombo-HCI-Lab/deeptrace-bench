id: effort
name: Effort (CLIP ViT-L/14)
modality: video
status: workable
licence: none published (README badge says CC BY-NC 4.0; issue 3 asks for a licence file)
paper: Yan et al., ICML 2025
upstream:
  # DeepfakeBench carries Effort's detector (training/detectors/effort_detector.py), so the
  # shared adapter runs it; Effort's own repo is YZY-stack/Effort-AIGI-Detection at 96f5dea.
  repo: SCLBD/DeepfakeBench
  commit: f188b1c105465e2e5377eb536a95022ae0e4522d
weights:
  # From Effort's checkpoints folder 19kQwGDjF18uk78EnnypxxOLaG4Aa4v1h (file
  # 1m4fyJecABU-Yk3bJ4b1WhUwQa0xCkMLI), which Google Drive refuses to gdown ("Quota exceeded",
  # 2026-10-05 to 2026-11-08 at least). Since 2026-11-13 the same file comes from a private mirror
  # under Oshan's Hugging Face account (upstream publishes no licence, so it isn't public): fetching
  # it needs an HF_TOKEN from that account; anyone else downloads it from Drive in a browser.
  - name: effort_clip_L14_trainOn_FaceForensic.pth
    kind: hf
    repo: ivantha/effort-clip-l14-ffpp
    filename: effort_clip_L14_trainOn_FaceForensic.pth
    revision: 3dc192f5a2b8fc5f9473571ee57216c7a6a0d8ae
    size_bytes: 1213769519
  - name: clip-vit-large-patch14-config
    kind: hf_snapshot
    repo: openai/clip-vit-large-patch14
    revision: 32bd64288804d66eefd0ccbe215aa642df71cc41
    allow_patterns: [config.json]
training_data:
  - {dataset: clip_wit, level: pretrain}
  - {dataset: ffpp, level: train, split: train, note: "c23"}
adapter: deeptrace_bench.models.deepfakebench:DeepfakeBenchDetector
input:
  detector: effort
  backbone_config: clip-vit-large-patch14-config
  crop: {size: 224, margin: 1.3, align: five_point}
  frames_per_clip: 32
notes: Adapter written 2026-10-05 (DeepfakeBench's Effort detector, CLIP built from a pinned config); its network builds offline, and since 2026-11-13 the checkpoint comes from a private Hugging Face mirror because Google Drive refuses automated downloads. Reported issues upstream - a reproduction gap (CDF-v2 AUC 0.885 against 0.956, issue 19) and keys reported missing from the FF++ checkpoint (issue 18) - get checked by the strict load once the file arrives.
