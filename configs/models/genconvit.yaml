id: genconvit
name: GenConViT
modality: video
status: later
licence: MIT code; CC BY-NC 4.0 weights (model card)
paper: Wodajo et al., Deepfake Video Detection Using Generative Convolutional Vision Transformer, arXiv 2307.07036
upstream:
  repo: erprogs/GenConViT
  commit: 2c1d0bd7eecea94926595781a744e3f4b8b55290
weights:
  - name: genconvit_ed_inference.pth
    kind: hf
    repo: Deressa/GenConViT
    filename: genconvit_ed_inference.pth
    revision: 32d6e9e3c931a37971cc756da706cf1eef643372
    size_bytes: 238000000
  - name: genconvit_vae_inference.pth
    kind: hf
    repo: Deressa/GenConViT
    filename: genconvit_vae_inference.pth
    revision: 32d6e9e3c931a37971cc756da706cf1eef643372
training_data:
  - {dataset: imagenet, level: pretrain}
  - {dataset: dfdc, level: train}
  - {dataset: ffpp, level: train}
  - {dataset: deepfake_timit, level: train}
input:
  crop: {size: 224, margin: 1.3, align: box}
  frames_per_clip: 15
notes: Trained on DFDC as well as FF++, and DFDC's paid actors are far more diverse in skin tone than FF++'s YouTube faces, so it tests whether more diverse training faces help on South Asian ones. Weights confirmed on the Hub 2026-10-28 (ED 238 MB, VAE 2.78 GB; size_bytes approximate until the first fetch records them). No adapter yet.
