id: genconvit
name: GenConViT (ED)
modality: video
status: workable
licence: MIT code; CC BY-NC 4.0 weights (model card)
paper: Wodajo et al., Deepfake Video Detection Using Generative Convolutional Vision Transformer, arXiv 2307.07036
upstream:
  repo: erprogs/GenConViT
  commit: 2c1d0bd7eecea94926595781a744e3f4b8b55290
weights:
  # The ED branch only: the VAE branch samples noise at test time, so its scores aren't
  # reproducible (models/genconvit.py says more).
  - name: genconvit_ed_inference.pth
    kind: hf
    repo: Deressa/GenConViT
    filename: genconvit_ed_inference.pth
    revision: 32d6e9e3c931a37971cc756da706cf1eef643372
training_data:
  - {dataset: imagenet, level: pretrain}
  - {dataset: dfdc, level: train}
  - {dataset: ffpp, level: train}
  - {dataset: deepfake_timit, level: train}
adapter: deeptrace_bench.models.genconvit:GenConViTDetector
input:
  crop: {size: 224, margin: 1.0, align: box}   # the box itself, stretched to 224, as upstream's tight dlib boxes
notes: Trained on DFDC as well as FF++, and DFDC's paid actors are far more diverse in skin tone than FF++'s YouTube faces, so it tests whether more diverse training faces help on South Asian ones. Weights confirmed on the Hub 2026-10-28. Adapter written 2026-10-28; scores the ED branch alone (upstream's --net ed), sampling the shared 32 frames per video where upstream takes 15.
