id: gend
name: GenD (CLIP ViT-L/14)
modality: video
status: ready
wave: 1
licence: MIT
paper: Yermakov et al., WACV 2026 (arXiv 2508.06248)
upstream:
  repo: yermandy/GenD
  commit: 387a42266dd385fbe8f7626c5d3aa03eea3bfaab
weights:
  - name: model.safetensors
    kind: hf
    repo: yermandy/GenD_CLIP_L_14
    filename: model.safetensors
    revision: 891ce014a0308386c4d7d25b3dcf436a22db5504
training_data:
  - {dataset: clip_wit, level: pretrain}
  - {dataset: ffpp, level: train, split: train, note: "the 14 benchmarks in the paper are test sets, not training data"}
adapter: deeptrace_bench.models.gend:GenDDetector
input:
  crop: {size: 224, margin: 1.3, align: five_point, normalize: clip}
  frames_per_clip: 32
notes: Already runs on torch 2.8 and transformers 4.56. PE and DINOv3 variants exist; DINOv3's backbone is gated by Meta.
