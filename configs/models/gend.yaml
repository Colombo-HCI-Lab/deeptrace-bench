id: gend
name: GenD (CLIP ViT-L/14)
modality: video
status: ready
wave: 1
licence: MIT
paper: Yermakov et al., WACV 2026 (arXiv 2508.06248)
upstream:
  repo: yermandy/GenD
  commit: 387a42266dd385fbe8f7626c5d3aa03eea3bfaab
weights:
  - name: model.safetensors
    kind: hf
    repo: yermandy/GenD_CLIP_L_14
    filename: model.safetensors
    revision: 891ce014a0308386c4d7d25b3dcf436a22db5504
  - name: config.json
    kind: hf
    repo: yermandy/GenD_CLIP_L_14
    filename: config.json
    revision: 891ce014a0308386c4d7d25b3dcf436a22db5504
  # GenD builds its backbone with CLIPModel.from_pretrained, unpinned. The adapter points it
  # at this pinned local copy instead, so a re-upload can't change the model and no network is
  # needed at score time.
  - name: clip-vit-large-patch14
    kind: hf_snapshot
    repo: openai/clip-vit-large-patch14
    revision: 32bd64288804d66eefd0ccbe215aa642df71cc41
    allow_patterns:
      - config.json
      - preprocessor_config.json
      - tokenizer.json
      - tokenizer_config.json
      - vocab.json
      - merges.txt
      - special_tokens_map.json
      - model.safetensors
training_data:
  - {dataset: clip_wit, level: pretrain}
  - {dataset: ffpp, level: train, split: train, note: "the 14 benchmarks in the paper are test sets, not training data"}
adapter: deeptrace_bench.models.gend:GenDDetector
input:
  backbone_snapshot: clip-vit-large-patch14
  # size null: aligned crops keep their native size (landmark spread x 1.3), as GenD's README
  # preprocessing does (--target_size none); CLIP's processor then resizes and crops to 224.
  crop: {size: null, margin: 1.3, align: five_point}
  frames_per_clip: 32
notes: >-
  Upstream already runs on torch 2.8 and transformers 4.56. Index 1 of the logits is fake;
  a video's score is the mean of its frames' P(fake). PE and DINOv3 variants exist; DINOv3's
  backbone is gated by Meta. Adapter written 2026-10-04; parity with upstream not yet checked.
