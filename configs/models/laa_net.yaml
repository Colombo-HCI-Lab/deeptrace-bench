id: laa_net
name: LAA-Net
modality: video
status: workable
licence: SnT academic licence (research use only)
paper: Nguyen et al., LAA-Net, CVPR 2024
upstream:
  repo: 10Ring/LAA-Net
  commit: a33446ab94b3bc0d176a879d43e0700adc52c817
weights:
  - name: laa_net_sbi.pth
    kind: url                       # the README's Dropbox folder, as one zip of 871 MB; the other file is the BI checkpoint
    url: "https://www.dropbox.com/scl/fo/dzmldaytujdeuky69d5x1/AIJrH2mit1hxnl1qzavM3vk?rlkey=nzzliincrfwejw2yr0ovldru1&st=z8ds7il7&dl=1"
    member: "PoseEfficientNet_EFN_hm10_EFPN_NoBasedCLS_Focal_C3_256Cst100_8SBI_SAM(Adam)_ADV_Era1_OutSigmoid_1e7_boost500_UnFZ_model_best.pth"
training_data:
  - {dataset: imagenet, level: pretrain, note: "EfficientNet-B4 initialised from the AdvProp ImageNet weights (INIT_WEIGHTS in the config)"}
  - {dataset: ffpp, level: train, split: train, note: "original (c0) real frames only, with blended pseudo-fakes"}
adapter: deeptrace_bench.models.laa_net:LAANetDetector
input:
  crop: {size: 256, margin: 1.5, align: box}   # upstream's saved crop: the box plus 25% a side, stretched to 256 x 256; the adapter cuts 5 px off each side and warps to 384
  frames_per_clip: 32
notes: SBI-style training on real faces only plus localised artefact attention. SBI is the second most robust model on full MAVOS-DD here (AUC 0.7765, 2026-10-28), so its newer relative is the natural next test. Upstream's test dataset reads RetinaFace crops saved by images_crop.py (box widened by 25% a side, 256 x 256); the shared SCRFD box stands in for RetinaFace's, and dlib landmarks (training only) aren't needed. The score is the cls logit averaged with the flipped image's, then a sigmoid; upstream averages logits over a video before the sigmoid, the harness averages probabilities. Adapter written 2026-11-03.
