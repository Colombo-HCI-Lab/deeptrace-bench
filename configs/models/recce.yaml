id: recce
name: RECCE (DeepfakeBench)
modality: video
status: workable
licence: CC BY-NC 4.0 (DeepfakeBench)
paper: "Cao et al., End-to-End Reconstruction-Classification Learning for Face Forgery Detection, CVPR 2022"
upstream:
  repo: SCLBD/DeepfakeBench
  commit: f188b1c105465e2e5377eb536a95022ae0e4522d
weights:
  - name: recce_best.pth
    kind: github_release
    url: https://github.com/SCLBD/DeepfakeBench/releases/download/v1.0.1/recce_best.pth
training_data:
  - {dataset: imagenet, level: pretrain}
  - {dataset: ffpp, level: train, split: train, note: "c23 per the DeepfakeBench README"}
adapter: deeptrace_bench.models.deepfakebench:DeepfakeBenchDetector
input:
  detector: recce
  crop: {size: 256, margin: 1.3, align: five_point}
  frames_per_clip: 32
notes: Learns to reconstruct real faces and flags what it can't reconstruct, a cue that doesn't depend on any one manipulation. Release v1.0.1 weights, added 2026-10-05; parity not run yet.
