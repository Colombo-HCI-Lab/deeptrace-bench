id: spsl
name: SPSL (DeepfakeBench)
modality: video
status: workable
licence: CC BY-NC 4.0 (DeepfakeBench)
paper: Liu et al., Spatial-Phase Shallow Learning, CVPR 2021
upstream:
  repo: SCLBD/DeepfakeBench
  commit: f188b1c105465e2e5377eb536a95022ae0e4522d
weights:
  - name: spsl_best.pth
    kind: github_release
    url: https://github.com/SCLBD/DeepfakeBench/releases/download/v1.0.1/spsl_best.pth
    size_bytes: 87764683
training_data:
  - {dataset: imagenet, level: pretrain}
  - {dataset: ffpp, level: train, split: train, note: "c23; the detector yaml lists FaceSwap only, which may not describe the released checkpoint"}
adapter: deeptrace_bench.models.deepfakebench:DeepfakeBenchDetector
input:
  detector: spsl
  crop: {size: 256, margin: 1.3, align: five_point}
  frames_per_clip: 32
notes: Phase cue, the phase spectrum of the grey image as a fourth input channel to Xception. Weights from DeepfakeBench release v1.0.1, checked 2026-10-05.
