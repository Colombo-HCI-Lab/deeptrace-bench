id: ucf
name: UCF (DeepfakeBench)
modality: video
status: workable
licence: CC BY-NC 4.0 (DeepfakeBench)
paper: Yan et al., UCF, ICCV 2023
upstream:
  repo: SCLBD/DeepfakeBench
  commit: f188b1c105465e2e5377eb536a95022ae0e4522d
weights:
  - name: ucf_best.pth
    kind: github_release
    url: https://github.com/SCLBD/DeepfakeBench/releases/download/v1.0.1/ucf_best.pth
    size_bytes: 188006161
training_data:
  - {dataset: imagenet, level: pretrain}
  - {dataset: ffpp, level: train, split: train, note: "c23; all four FF++ manipulations per the detector yaml"}
adapter: deeptrace_bench.models.deepfakebench:DeepfakeBenchDetector
input:
  detector: ucf
  crop: {size: 256, margin: 1.3, align: five_point}
  frames_per_clip: 32
notes: Disentangles forgery-specific from common forgery features; scores with the common head only. Its inference path also runs the content encoder, which the score doesn't use. Weights from DeepfakeBench release v1.0.1, checked 2026-10-05.
