id: xception
name: Xception (DeepfakeBench)
modality: video
status: ready
wave: 1
licence: CC BY-NC 4.0 (DeepfakeBench)
paper: Rossler et al., FaceForensics++, ICCV 2019
upstream:
  repo: SCLBD/DeepfakeBench
  commit: f188b1c105465e2e5377eb536a95022ae0e4522d
weights:
  - name: xception_best.pth
    kind: github_release
    url: https://github.com/SCLBD/DeepfakeBench/releases/download/v1.0.1/xception_best.pth
    size_bytes: 87763531
training_data:
  - {dataset: imagenet, level: pretrain}
  - {dataset: ffpp, level: train, split: train, note: "c23 per the DeepfakeBench README (issue 151 unanswered)"}
adapter: deeptrace_bench.models.deepfakebench:DeepfakeBenchDetector
input:
  detector: xception      # training/config/detector/<name>.yaml in the checkout
  crop: {size: 256, margin: 1.3, align: five_point}
  frames_per_clip: 32
notes: Upstream pins torch 1.12 and dlib; we port to the shared env and check parity.
