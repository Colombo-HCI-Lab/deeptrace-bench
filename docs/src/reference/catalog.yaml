# Facts for the site's Models & data tables and docs/catalog.md, keyed by config id.
# Descriptions rewritten 2026-10-12 against the configs, builders, docs and each paper;
# published numbers checked 2026-10-12.
#   why        why it was picked and what it tests for South Asia, in one or two sentences
#   cut        true for a cut candidate: it adds little the others don't show; the team decides
#   s2_id      Semantic Scholar id of the paper (ARXIV:, DOI: or a paperId); counts are
#              fetched into results/citations.json by `scripts/build_site.py --citations`
#   venue      short venue and year, as the page shows it
#   summary    one technical line for an ML reader
#   models:    architecture (building blocks, input to output), description (2 to 3 sentences:
#              architecture, training data of the released weights, the caveat that matters
#              here; no result numbers, the site shows them from `published` and our runs)
#   published  list of {test, metric, value, source, cite, evalset}: source is one of paper,
#              model card, repo README, DeepfakeBench; cite is the table or section; evalset is
#              our evalset id when we score the same set. Only numbers read in the source for
#              the released weights or their paper.
#   datasets:  scale, generators (how fakes were made; [] for real only), annotations (per-clip
#              labels the dataset ships), format, notes (a caveat users must know)
models:
  aasist:
    why: >-
      The most-cited open audio detector, trained only on English ASVspoof speech: it stands for the
      off-the-shelf detector a South Asian platform would deploy today, and is the classic half of
      the probe's audio pair.
    s2_id: ARXIV:2110.01200
    venue: ICASSP 2022
    published:
      - {test: "ASVspoof 2019 LA eval", metric: EER, value: "0.83%", source: paper, cite: "Table 2, best single run; 3-seed mean 1.13%", evalset: asvspoof2019_la_eval}
    summary: >-
      Raw-waveform sinc filters and residual encoder, then spectral and temporal graph attention
      joined by a max graph operation; trained on ASVspoof 2019 LA only.
    architecture: >-
      Raw 16 kHz waveform in 64,600-sample windows, SincNet-style filters and residual encoder, spectral
      and temporal graph attention with a max graph operation, two-way classifier
    description: >-
      AASIST (Jung et al., ICASSP 2022) builds graphs over spectral and temporal nodes of a learned
      time-frequency map and combines them with heterogeneous graph attention, so one model covers
      artefacts that earlier work needed an ensemble for. The released weights saw only the ASVspoof
      2019 LA training split, with no pretraining. A compact single-corpus baseline that sits near
      chance on In-the-Wild.
  aasist3:
    why: >-
      Picked as the only AASIST variant trained with multilingual fakes (MLAAD, which has Hindi,
      Bengali, Tamil, Urdu and Sinhala). The released weights aren't the paper's and score far below
      it, so they can't answer that question, and the guard refuses them on every MLAAD evalset.
    cut: true
    s2_id: ARXIV:2408.17352
    venue: ASVspoof 2024 Workshop
    published:
      - {test: "ASVspoof 5 eval, open condition", metric: EER, value: "4.89%", source: paper, cite: "Table 1, ensemble with extra data; not the released weights"}
      - {test: "ASVspoof 2019 LA eval", metric: EER, value: "9.44%", source: model card, cite: "released weights, Speech Arena re-scoring", evalset: asvspoof2019_la_eval}
      - {test: "In-the-Wild", metric: EER, value: "29.72%", source: model card, cite: "released weights, Speech Arena re-scoring", evalset: in_the_wild}
    summary: >-
      AASIST on wav2vec 2.0 XLSR-53 features with Kolmogorov-Arnold (KAN) layers; the released weights
      are not the paper's and are weak.
    architecture: >-
      Pre-emphasised 16 kHz window, wav2vec 2.0 XLSR-53 features, KAN bridge and residual encoder,
      spectral and temporal graph attention, four inference branches, KAN output layer, two-way classifier
    description: >-
      AASIST3 (Borodin et al., 2024), built for ASVspoof 5, feeds XLSR-53 features into AASIST and
      replaces some layers with KAN layers. The released weights saw ASVspoof 2019 LA, ASVspoof 5,
      MLAAD and M-AILABS on a front end pretrained on Common Voice, BABEL and Multilingual LibriSpeech,
      so the contamination guard refuses it on MLAAD-based evalsets. The repository says these are
      not the weights behind the paper's numbers, and the model card's Speech Arena re-scoring puts
      them far lower, so treat it as a weak multilingual baseline; parity is not checked yet.
  aasist_l:
    why: >-
      Picked as the phone-sized AASIST, for detection on cheap devices. On every South Asian set so
      far it scores within a few hundredths of AASIST, so it shows nothing the bigger model doesn't.
    cut: true
    s2_id: ARXIV:2110.01200
    venue: ICASSP 2022
    published:
      - {test: "ASVspoof 2019 LA eval", metric: EER, value: "0.99%", source: paper, cite: "Table 2, best single run", evalset: asvspoof2019_la_eval}
    summary: >-
      The lightweight AASIST configuration (about 85k parameters): same raw-waveform graph attention,
      trained on ASVspoof 2019 LA only.
    architecture: >-
      Raw 16 kHz waveform in 64,600-sample windows, SincNet-style filters and residual encoder, spectral
      and temporal graph attention with a max graph operation, two-way classifier (lightweight configuration)
    description: >-
      AASIST-L is the reduced configuration from the AASIST paper (Jung et al., ICASSP 2022), with
      the same architecture at a fraction of the width. The released weights saw only the ASVspoof
      2019 LA training split. The cheapest single-corpus baseline here; like AASIST it is near chance
      on In-the-Wild.
  altfreezing:
    why: >-
      The probe's temporal video detector: talking heads and lip-sync fakes are edited over time,
      and frame models can miss motion artefacts. Blocked until someone can fetch its weights.
    s2_id: ARXIV:2307.08317
    venue: CVPR 2023
    published:
      - {test: "Celeb-DF v2", metric: AUC, value: "0.895", source: paper, cite: "Table 1, video-level", evalset: celeb_df_v2_test}
      - {test: "DFD", metric: AUC, value: "0.985", source: paper, cite: "Table 1, video-level"}
      - {test: "FaceShifter", metric: AUC, value: "0.994", source: paper, cite: "Table 1, video-level"}
    summary: >-
      3D CNN on face clips whose spatial and temporal weight groups are frozen alternately in training,
      so it learns both cue types; FF++. Blocked.
    architecture: >-
      Face video clip, 3D convolutional network whose spatial and temporal weight groups are frozen
      alternately during training, two-way classifier
    description: >-
      AltFreezing (Wang et al., CVPR 2023) counters a 3D CNN's tendency to rely on either spatial
      or temporal cues by training the two weight groups in alternation. The released weights were
      trained on FaceForensics++ (compression not stated). Blocked here: the weights are only on
      RecDrive and Baidu, upstream issues report the file gone, and there is no adapter.
  antideepfake_mms_300m:
    why: >-
      Half of the cleanest test of the language question: the same post-training as the w2v2 small
      model on a backbone pretrained on about 1,400 languages. Its post-training heard Hindi,
      Bengali, Urdu, Tamil and Nepali but no Sinhala, so a Sinhala set would show what an unheard
      South Asian language does.
    s2_id: ARXIV:2506.21090
    venue: ASRU 2025
    published:
      - {test: "In-the-Wild", metric: EER, value: "2.90%", source: model card, cite: "results table; paper Table II", evalset: in_the_wild}
      - {test: "ADD 2023", metric: EER, value: "7.93%", source: model card, cite: "results table; paper Table II"}
      - {test: "Deepfake-Eval-2024", metric: EER, value: "32.84%", source: model card, cite: "results table; paper Table II"}
    summary: >-
      MMS-300M wav2vec 2.0 front end, mean pooling and a linear head, post-trained on 74k hours of
      real and fake speech in over 100 languages.
    architecture: >-
      Raw 16 kHz waveform in 64,600-sample windows (zero mean, unit variance), MMS-300M wav2vec 2.0
      front end, mean pooling over frames, linear layer, two-way classifier
    description: >-
      AntiDeepfake (Ge et al., NII Yamagishi Lab, 2025) inserts a post-training stage on real and
      fake speech between SSL pretraining and task fine-tuning. This model starts from MMS-300M (pretrained
      on about 1,400 languages) and is post-trained on 74k hours from 29 corpora in over 100 languages,
      including FLEURS, MLAAD, all of ASVspoof 2019 LA, LJSpeech and VoxCeleb2. The broadest multilingual
      exposure of any audio model here, so the contamination guard refuses it on MLAAD-based evalsets
      and anything built from FLEURS.
  antideepfake_w2v_small:
    why: >-
      The other half of that pair: the same post-training on an English-only backbone, so its gap to
      MMS-300M on South Asian speech comes from the pretraining languages alone.
    s2_id: ARXIV:2506.21090
    venue: ASRU 2025
    published:
      - {test: "In-the-Wild", metric: EER, value: "4.24%", source: model card, cite: "results table; paper Table II gives 4.23%", evalset: in_the_wild}
      - {test: "ADD 2023", metric: EER, value: "13.02%", source: model card, cite: "results table; paper Table II"}
      - {test: "Deepfake-Eval-2024", metric: EER, value: "33.33%", source: model card, cite: "results table; paper Table II"}
    summary: >-
      English-pretrained wav2vec 2.0 base (95M parameters) with the same AntiDeepfake post-training;
      the cheap counterpart to MMS-300M.
    architecture: >-
      Raw 16 kHz waveform in 64,600-sample windows (zero mean, unit variance), wav2vec 2.0 base front
      end, mean pooling over frames, linear layer, two-way classifier
    description: >-
      The smallest AntiDeepfake model (Ge et al., 2025): wav2vec 2.0 base pretrained on LibriSpeech
      only, post-trained on the same 74k hours from 29 corpora as the MMS-300M model, with mean pooling
      and one linear layer. Identical post-training data make the pair a controlled test of multilingual
      pretraining. The contamination guard refuses it on MLAAD-based evalsets and anything built from
      FLEURS.
  core:
    why: >-
      Trained for representations that stay consistent across augmented views, so it tests whether
      that robustness survives South Asian faces and the recompression of forwarded clips. Like
      every DeepfakeBench detector here it trained on FF++, so each reads a different cue on the
      same faces; second tier, worth running once South Asian video arrives.
    s2_id: ARXIV:2206.02749
    venue: CVPRW 2022
    published:
      - {test: "FF++ c23 test", metric: AUC, value: "0.964", source: DeepfakeBench, cite: "Table 3, frame-level", evalset: ffpp_test}
      - {test: "Celeb-DF v2", metric: AUC, value: "0.743", source: DeepfakeBench, cite: "Table 3, frame-level", evalset: celeb_df_v2_test}
      - {test: "DFDC", metric: AUC, value: "0.705", source: DeepfakeBench, cite: "Table 3, frame-level"}
    summary: >-
      Xception frame classifier trained with a consistency loss between representations of augmented
      views; DeepfakeBench weights, FF++ c23.
    architecture: >-
      Aligned 256 px face crop, Xception CNN trained with a consistency loss across augmented views,
      two-way classifier
    description: >-
      CORE (Ni et al., CVPRW 2022) penalises the distance between representations of differently
      augmented views of a face (crops, colour changes) to reduce overfitting; at test time it is
      a plain Xception frame classifier. DeepfakeBench's weights were trained on FaceForensics++ (c23
      per the DeepfakeBench README) after ImageNet pretraining. It differs from the Xception baseline
      only in the training loss.
  df_arena_1b:
    why: >-
      The strongest open audio detector, so it sets the ceiling South Asian results are read
      against. Its training includes MLAAD, whose generators recur in South Asian sets, so part of
      its score there may be familiarity.
    s2_id: ARXIV:2509.02859
    venue: Speech DF Arena 2025
    published:
      - {test: "In-the-Wild", metric: EER, value: "0.91%", source: model card, cite: "evaluation table", evalset: in_the_wild}
      - {test: "ASVspoof 2019 LA", metric: EER, value: "1.14%", source: model card, cite: "evaluation table; trained on its train split"}
      - {test: "ASVspoof 2021 DF eval", metric: EER, value: "1.75%", source: model card, cite: "evaluation table"}
    summary: >-
      XLS-R 1B front end, attention pooling over every hidden layer and a conformer head; the top
      open model on the Speech DF Arena.
    architecture: >-
      Raw 16 kHz waveform in 64,600-sample windows, XLS-R 1B front end, attention pooling over every
      hidden layer, conformer head, spoof or bona fide classifier
    description: >-
      Released by the team behind the Speech DF Arena leaderboard (Speech-Arena-2025). The XLS-R
      front end was pretrained on Common Voice, BABEL, MLS, VoxPopuli and VoxLingua107, and the detector
      trained on ASVspoof 2019 and 2024, MLAAD, Codecfake, LibriSeVoc, DFADD, CtrSVDD, SpoofCeleb
      and EnvSDD. The contamination guard therefore refuses it on ASVspoof 2019 LA eval and MLAAD-based
      evalsets.
  df_arena_500m:
    why: >-
      Picked to test whether size helps on South Asian speech. The 1B model isn't consistently
      better, so with that reported the smaller one is redundant.
    cut: true
    s2_id: ARXIV:2509.02859
    venue: Speech DF Arena 2025
    published:
      - {test: "In-the-Wild", metric: EER, value: "1.76%", source: model card, cite: "evaluation table", evalset: in_the_wild}
      - {test: "ASVspoof 2019 LA", metric: EER, value: "1.09%", source: model card, cite: "evaluation table; trained on its train split"}
      - {test: "ASVspoof 2021 DF eval", metric: EER, value: "3.30%", source: model card, cite: "evaluation table"}
    summary: >-
      The XLS-R 300M sibling of DF Arena 1B: same all-layer attention pooling, conformer head and
      broad training mix.
    architecture: >-
      Raw 16 kHz waveform in 64,600-sample windows, XLS-R 300M front end, attention pooling over every
      hidden layer, conformer head, spoof or bona fide classifier
    description: >-
      Same design and training data as DF Arena 1B (Speech-Arena-2025) with the smaller XLS-R 300M
      front end, pretrained on Common Voice, BABEL, MLS, VoxPopuli and VoxLingua107; the detector
      saw ASVspoof 2019 and 2024, MLAAD, Codecfake, LibriSeVoc, DFADD, CtrSVDD, SpoofCeleb and EnvSDD.
      The contamination guard refuses it on ASVspoof 2019 LA eval and MLAAD-based evalsets.
  efficientnet_b4:
    why: >-
      Picked as a second classic video baseline beside Xception. It reads the same texture cue from
      the same FF++ training, so it is unlikely to show anything about South Asian faces that
      Xception doesn't.
    cut: true
    s2_id: ARXIV:2004.07676
    venue: ICPR 2020
    published:
      - {test: "FF++ c23 test", metric: AUC, value: "0.957", source: DeepfakeBench, cite: "Table 3, frame-level", evalset: ffpp_test}
      - {test: "Celeb-DF v2", metric: AUC, value: "0.749", source: DeepfakeBench, cite: "Table 3, frame-level", evalset: celeb_df_v2_test}
      - {test: "DFDC", metric: AUC, value: "0.696", source: DeepfakeBench, cite: "Table 3, frame-level"}
    summary: >-
      Plain EfficientNet-B4 frame classifier on aligned face crops; DeepfakeBench's single-network
      version, trained on FF++ c23.
    architecture: Aligned 256 px face crop, EfficientNet-B4 CNN, two-way classifier
    description: >-
      DeepfakeBench's single-network version of the detector studied by Bonettini et al. (ICPR 2020),
      whose paper ensembles several EfficientNet-B4 variants. The weights were trained on FaceForensics++
      (c23 per the DeepfakeBench README) after ImageNet pretraining. With Xception it is the plain-CNN
      video baseline, with no forgery-specific cue.
  effort:
    why: >-
      The probe's original foundation-model video detector, the partner to Xception. Blocked on
      weights; GenD holds its place until they arrive.
    s2_id: ARXIV:2411.15633
    venue: ICML 2025
    published:
      - {test: "Celeb-DF v2", metric: AUC, value: "0.956", source: paper, cite: "Table 1, video-level", evalset: celeb_df_v2_test}
      - {test: "DFDCP", metric: AUC, value: "0.909", source: paper, cite: "Table 1, video-level"}
      - {test: "DFDC", metric: AUC, value: "0.843", source: paper, cite: "Table 1, video-level"}
    summary: >-
      CLIP ViT-L/14 adapted by SVD: principal singular components frozen, residual tuned; DeepfakeBench
      detector on FF++ c23. Blocked on weights.
    architecture: >-
      Aligned 224 px face crop, CLIP ViT-L/14 image encoder with SVD-split weights (principal part
      frozen, residual part tuned), linear head
    description: >-
      Effort (Yan et al., ICML 2025) splits each weight matrix by SVD, freezes the principal subspace
      and trains only the residual, which the authors argue stops fine-tuning from collapsing the
      feature space onto a few fake patterns. The paper targets AI-generated images broadly; here
      DeepfakeBench's Effort detector, trained on FaceForensics++ (c23) after CLIP pretraining on
      OpenAI's private data, scores face frames. Blocked since Google Drive refused the weight file
      as over quota on 2026-10-05; upstream also reports a Celeb-DF v2 reproduction gap and has no
      licence file.
  f3net:
    why: >-
      Reads frequency bands chosen to survive compression, the cue most likely to matter for South
      Asian clips that circulate recompressed on messaging apps. Like every DeepfakeBench detector
      here it trained on FF++, so each reads a different cue on the same faces; second tier, worth
      running once South Asian video arrives.
    s2_id: ARXIV:2007.09355
    venue: ECCV 2020
    published:
      - {test: "FF++ c23 test", metric: AUC, value: "0.964", source: DeepfakeBench, cite: "Table 3, frame-level", evalset: ffpp_test}
      - {test: "Celeb-DF v2", metric: AUC, value: "0.735", source: DeepfakeBench, cite: "Table 3, frame-level", evalset: celeb_df_v2_test}
      - {test: "DFDC", metric: AUC, value: "0.702", source: DeepfakeBench, cite: "Table 3, frame-level"}
    summary: >-
      DCT frequency-band decomposition (12 input channels) into Xception, for artefacts that survive
      compression; DeepfakeBench weights, FF++ c23.
    architecture: >-
      Aligned 256 px face crop, DCT frequency-band decomposition (12 input channels), Xception CNN,
      two-way classifier
    description: >-
      F3Net (Qian et al., ECCV 2020) splits each face crop into frequency bands with a discrete cosine
      transform and classifies the bands with Xception, since manipulation traces persist there after
      video compression. DeepfakeBench's weights were trained on FaceForensics++ (c23) after ImageNet
      pretraining. The detector's yaml names only NeuralTextures, which may not describe the checkpoint;
      the benchmark treats it as trained on all of FF++.
  ffd:
    why: >-
      Learns where on the face the manipulation is, so it shows whether its attention transfers to
      South Asian faces. Like every DeepfakeBench detector here it trained on FF++, so each reads a
      different cue on the same faces; second tier, worth running once South Asian video arrives.
    s2_id: ARXIV:1910.01717
    venue: CVPR 2020
    published:
      - {test: "FF++ c23 test", metric: AUC, value: "0.962", source: DeepfakeBench, cite: "Table 3, frame-level", evalset: ffpp_test}
      - {test: "Celeb-DF v2", metric: AUC, value: "0.744", source: DeepfakeBench, cite: "Table 3, frame-level", evalset: celeb_df_v2_test}
      - {test: "DFDC", metric: AUC, value: "0.703", source: DeepfakeBench, cite: "Table 3, frame-level"}
    summary: >-
      Xception with a learned attention map over manipulated regions that reweights features before
      classification; DeepfakeBench weights, FF++ c23.
    architecture: >-
      Aligned 256 px face crop, Xception CNN with an attention map over manipulated regions, two-way
      classifier
    description: >-
      FFD (Dang et al., CVPR 2020) estimates an attention map of manipulated face regions and uses
      it to reweight the feature maps; the map doubles as a coarse forgery localisation. DeepfakeBench's
      weights were trained on FaceForensics++ (c23 per the DeepfakeBench README) after ImageNet pretraining.
      Passes parity against the original code.
  gend:
    why: >-
      The foundation-model half of the video pair, in Effort's place. Its backbone was pretrained on
      far more varied faces than FF++, which tests whether that removes skin-tone bias; on HiDF it
      flagged real Indian faces most often, so it is the first model to check on South Asian faces.
    s2_id: ARXIV:2508.06248
    venue: WACV 2026
    published:
      - {test: "Celeb-DF v2", metric: AUC, value: "0.946", source: paper, cite: "Table 4, 5-seed mean, video-level", evalset: celeb_df_v2_test}
      - {test: "DFDC", metric: AUC, value: "0.864", source: paper, cite: "Table 4, 5-seed mean, video-level"}
      - {test: "14 cross-dataset sets, mean", metric: AUC, value: "0.912", source: paper, cite: "Table 4, video-level"}
    summary: >-
      CLIP ViT-L/14 with only LayerNorm tuned, L2-normalised features and metric learning; frame
      probabilities averaged per video. Trained on FF++.
    architecture: >-
      Aligned face crop at native size, CLIP ViT-L/14 image encoder with only LayerNorm parameters
      tuned, L2-normalised features, linear head
    description: >-
      GenD (Yermakov et al., WACV 2026) tunes only CLIP's LayerNorm parameters (about 0.03% of the
      model), constrains features to the hypersphere with L2 normalisation and metric learning, and
      averages per-frame P(fake) over the video. The released weights were trained on FaceForensics++
      only, after CLIP pretraining on OpenAI's private image-text data. The main generalisation-first
      video model here; the adapter runs end to end but parity is not checked yet.
  gend_pe_l:
    why: >-
      The same GenD recipe on Meta's Perception Encoder instead of CLIP: whether the pretraining
      behind the backbone changes how it treats South Asian faces. Second tier, run beside GenD
      (CLIP).
    s2_id: ARXIV:2508.06248
    venue: WACV 2026
    published:
      - {test: "Celeb-DF v2", metric: AUC, value: "0.950", source: paper, cite: "Table 4, 5-seed mean, video-level", evalset: celeb_df_v2_test}
      - {test: "DFDC", metric: AUC, value: "0.822", source: paper, cite: "Table 4, 5-seed mean, video-level"}
      - {test: "14 cross-dataset sets, mean", metric: AUC, value: "0.914", source: paper, cite: "Table 4, video-level"}
    summary: >-
      The GenD recipe (LayerNorm-only tuning, L2-normalised features) on Meta's Perception Encoder
      L/14 instead of CLIP.
    architecture: >-
      Aligned face crop at native size resized to 224, Meta Perception Encoder L/14 with only LayerNorm
      parameters tuned, L2-normalised features, linear head
    description: >-
      GenD's second released backbone (Yermakov et al., WACV 2026): identical training on Perception
      Encoder, so the pair isolates the effect of the foundation model. Trained on FaceForensics++
      only; Meta's pretraining data are not public, so overlap with our data cannot be checked. Parity
      is not checked yet.
  havic:
    why: >-
      The only open audio-visual detector. v1 focuses on lip-sync with cloned voices, which only a
      model that checks whether voice and mouth agree can catch; MAVOS-DD Hindi is its South Asian
      test, and it is refused on FakeAVCeleb, which it was fine-tuned on.
    s2_id: ARXIV:2603.23960
    venue: CVPR 2026 Findings
    published:
      - {test: "FakeAVCeleb", metric: AUC, value: "0.999", source: paper, cite: "Table 2, in-domain", evalset: fakeavceleb}
      - {test: "KoDF", metric: AUC, value: "0.989", source: paper, cite: "Table 3, cross-dataset"}
      - {test: "HiFi-AVDF, 6-generator mean", metric: AUC, value: "0.758", source: paper, cite: "Table 4, cross-dataset"}
    summary: >-
      Audio and video transformers pretrained on real videos for audio-visual coherence, fused to
      score 16-frame windows; fine-tuned on FakeAVCeleb.
    architecture: >-
      16-frame windows of 224 px face frames plus 128-bin audio filterbank, audio and video transformer
      encoders pretrained on real videos, audio-visual interaction module, MLP classifier, one logit
      per window
    description: >-
      HAVIC (CVPR 2026 Findings) pretrains its audio and video encoders on real videos only (LRS2)
      to model temporal and cross-modal coherence, then fuses them to score clips whose lips, voice
      or expression disagree. It was fine-tuned on a random 70% of FakeAVCeleb with an unpublished
      item list, so the contamination guard refuses it on FakeAVCeleb. The only open audio-visual
      detector here; it needs at least 3.2 s of video with a face in all 16 sampled frames (too long
      for HiDF), and parity is not checked yet.
  lipforensics:
    why: >-
      Looks only at the mouth, where lip-sync fakes, v1's focus, are edited. Tests whether FF++
      face-swap detectors miss mouth-only edits on South Asian talking heads.
    s2_id: ARXIV:2012.07657
    venue: CVPR 2021
    published:
      - {test: "FF++, unseen manipulations", metric: AUC, value: "0.971", source: paper, cite: "Table 1, leave-one-out mean, video-level"}
      - {test: "Celeb-DF v2", metric: AUC, value: "0.824", source: paper, cite: "Table 2, video-level", evalset: celeb_df_v2_test}
      - {test: "DFDC", metric: AUC, value: "0.735", source: paper, cite: "Table 2, video-level"}
    summary: >-
      Lipreading-pretrained ResNet-18 and multi-scale temporal CNN on grayscale mouth crops, flagging
      unnatural mouth motion; LRW, then FF++ c23.
    architecture: >-
      25-frame clips of 96 px grayscale mouth crops (88 px centre crop), ResNet-18 with 3D stem, multi-scale
      temporal convolutional network, one logit per clip
    description: >-
      LipForensics (Haliassos et al., CVPR 2021) is pretrained for lipreading on LRW, then its temporal
      network is fine-tuned on FaceForensics++ (c23, all four manipulations) to separate real from
      forged mouth motion, a high-level cue the authors argue survives unseen manipulations and compression.
      Central here because lip-sync fakes are a focus. Caveats: users report its FF++ numbers do not
      reproduce, it needs 25 consecutive frames with a detectable face, and parity is not checked
      yet.
  recce:
    why: >-
      Learns to reconstruct real faces only, so it tests whether its idea of a real face, learned
      from FF++, holds for South Asian faces. Like every DeepfakeBench detector here it trained on
      FF++, so each reads a different cue on the same faces; second tier, worth running once South
      Asian video arrives.
    s2_id: 1537faa9593d0d20e62055e4e6af6d382a26d313
    venue: CVPR 2022
    published:
      - {test: "FF++ c23 test", metric: AUC, value: "0.962", source: DeepfakeBench, cite: "Table 3, frame-level", evalset: ffpp_test}
      - {test: "Celeb-DF v2", metric: AUC, value: "0.732", source: DeepfakeBench, cite: "Table 3, frame-level", evalset: celeb_df_v2_test}
      - {test: "DFDC", metric: AUC, value: "0.713", source: DeepfakeBench, cite: "Table 3, frame-level"}
    summary: >-
      Xception encoder-decoder that reconstructs real faces only; reconstruction differences guide
      the classifier. DeepfakeBench weights, FF++ c23.
    architecture: >-
      Aligned 256 px face crop, Xception encoder with a decoder that reconstructs the face and guides
      attention from the reconstruction, two-way classifier
    description: >-
      RECCE (Cao et al., CVPR 2022) trains a decoder to reconstruct real faces, so fakes reconstruct
      poorly, and uses the reconstruction differences to guide attention; the cue is not tied to one
      manipulation method. DeepfakeBench's weights were trained on FaceForensics++ (c23 per the DeepfakeBench
      README) after ImageNet pretraining. Passes parity against the original code.
  sbi:
    why: >-
      Trained on real faces blended into themselves, never on real deepfakes, so it depends least on
      its training set's faces and generators. The probe's test of whether that generalises better
      to South Asian faces and unseen generators.
    s2_id: ARXIV:2204.08376
    venue: CVPR 2022
    published:
      - {test: "Celeb-DF v2", metric: AUC, value: "0.932", source: paper, cite: "Table 1", evalset: celeb_df_v2_test}
      - {test: "DFDCP", metric: AUC, value: "0.862", source: paper, cite: "Table 1"}
      - {test: "DFDC", metric: AUC, value: "0.724", source: paper, cite: "Table 1"}
    summary: >-
      EfficientNet-B4 trained on self-blended images (a real face blended with an altered copy of
      itself); real FF++ videos only, c23 checkpoint.
    architecture: >-
      Face box widened by one eighth on each side and resized to 380 px, EfficientNet-B4 CNN, two-way
      classifier
    description: >-
      SBI (Shiohara and Yamasaki, CVPR 2022) synthesises its training fakes by blending each real
      face with a slightly transformed copy of itself, producing the blending boundaries and statistical
      mismatches of face swaps without any real generator. Only FaceForensics++ real videos were used,
      after ImageNet pretraining; the c23 checkpoint is used here. Research-only licence, so its code
      is never copied into this repository.
  spsl:
    why: >-
      Reads the phase spectrum, where upsampling leaves traces whatever the face, so it tests a cue
      that shouldn't depend on skin tone. Like every DeepfakeBench detector here it trained on FF++,
      so each reads a different cue on the same faces; second tier, worth running once South Asian
      video arrives.
    s2_id: ARXIV:2103.01856
    venue: CVPR 2021
    published:
      - {test: "FF++ c23 test", metric: AUC, value: "0.961", source: DeepfakeBench, cite: "Table 3, frame-level", evalset: ffpp_test}
      - {test: "Celeb-DF v2", metric: AUC, value: "0.765", source: DeepfakeBench, cite: "Table 3, frame-level", evalset: celeb_df_v2_test}
      - {test: "DFDC", metric: AUC, value: "0.704", source: DeepfakeBench, cite: "Table 3, frame-level"}
    summary: >-
      Xception with the grey image's phase spectrum as a fourth input channel, where upsampling leaves
      traces; DeepfakeBench weights, FF++ c23.
    architecture: >-
      Aligned 256 px face crop, RGB plus phase spectrum of the grey image as a fourth channel, Xception
      CNN, two-way classifier
    description: >-
      SPSL (Liu et al., CVPR 2021) adds the phase spectrum as an input channel beside RGB, since the
      upsampling in most face-forgery pipelines perturbs it. DeepfakeBench's weights were trained
      on FaceForensics++ (c23) after ImageNet pretraining and use the full Xception, not the paper's
      shallower network. The detector's yaml lists only FaceSwap, which may not describe the checkpoint;
      the benchmark treats it as trained on all of FF++.
  srm:
    why: >-
      Reads high-frequency noise residuals, a cue sensitive to the phone cameras and compression
      typical of South Asian social media. Like every DeepfakeBench detector here it trained on
      FF++, so each reads a different cue on the same faces; second tier, worth running once South
      Asian video arrives.
    s2_id: ARXIV:2103.12376
    venue: CVPR 2021
    published:
      - {test: "FF++ c23 test", metric: AUC, value: "0.958", source: DeepfakeBench, cite: "Table 3, frame-level", evalset: ffpp_test}
      - {test: "Celeb-DF v2", metric: AUC, value: "0.755", source: DeepfakeBench, cite: "Table 3, frame-level", evalset: celeb_df_v2_test}
      - {test: "DFDC", metric: AUC, value: "0.700", source: DeepfakeBench, cite: "Table 3, frame-level"}
    summary: >-
      Two-stream Xception: RGB plus SRM high-frequency noise residuals, coupled by cross-stream attention;
      DeepfakeBench weights, FF++ c23.
    architecture: >-
      Aligned 256 px face crop, RGB stream plus a stream of high-frequency noise residuals from SRM
      filters, Xception CNN with attention linking the two streams, two-way classifier
    description: >-
      SRM (Luo et al., CVPR 2021) adds a stream of SRM-filtered high-frequency noise, where tampered
      and genuine regions differ, to avoid overfitting to method-specific colour textures, and lets
      the two streams guide each other with attention. DeepfakeBench's weights were trained on FaceForensics++
      (c23 per the DeepfakeBench README) after ImageNet pretraining. Passes parity against the original
      code.
  ucf:
    why: >-
      Built to find forgery traces common to every generator, so it tests generalisation to the
      generators actually used in South Asia. Like every DeepfakeBench detector here it trained on
      FF++, so each reads a different cue on the same faces; second tier, worth running once South
      Asian video arrives.
    s2_id: ARXIV:2304.13949
    venue: ICCV 2023
    published:
      - {test: "FF++ c23 test", metric: AUC, value: "0.971", source: DeepfakeBench, cite: "Table 3, frame-level", evalset: ffpp_test}
      - {test: "Celeb-DF v2", metric: AUC, value: "0.753", source: DeepfakeBench, cite: "Table 3, frame-level", evalset: celeb_df_v2_test}
      - {test: "DFDC", metric: AUC, value: "0.719", source: DeepfakeBench, cite: "Table 3, frame-level"}
    summary: >-
      Xception encoders disentangle content, method-specific and common forgery features; only the
      common-forgery head scores. DeepfakeBench weights, FF++ c23.
    architecture: >-
      Aligned 256 px face crop, Xception encoders separating content, method-specific forgery and
      common forgery features, scored with the common-forgery head only
    description: >-
      UCF (Yan et al., ICCV 2023) splits face features into forgery-irrelevant content, method-specific
      forgery and common forgery parts, and decides on the common part only, aiming at unseen manipulation
      methods. DeepfakeBench's weights were trained on all four FaceForensics++ methods (c23) after
      ImageNet pretraining. Passes parity against the original code.
  xception:
    why: >-
      The most-cited video detector and the classic half of the video pair. Its training set, FF++,
      is dominated by lighter-skinned faces, so it measures what a standard detector does on South
      Asian skin tones.
    s2_id: ARXIV:1901.08971
    venue: ICCV 2019
    published:
      - {test: "FF++ c23 test", metric: AUC, value: "0.964", source: DeepfakeBench, cite: "Table 3, frame-level", evalset: ffpp_test}
      - {test: "Celeb-DF v2", metric: AUC, value: "0.737", source: DeepfakeBench, cite: "Table 3, frame-level", evalset: celeb_df_v2_test}
      - {test: "DFDC", metric: AUC, value: "0.708", source: DeepfakeBench, cite: "Table 3, frame-level"}
    summary: >-
      Xception (depthwise separable CNN) frame classifier on aligned face crops; the FF++ baseline,
      DeepfakeBench weights trained on c23.
    architecture: >-
      Aligned 256 px face crop, Xception CNN with depthwise separable convolutions, two-way classifier
    description: >-
      The face-forgery detector from the FaceForensics++ paper (Rossler et al., ICCV 2019), and the
      backbone the other DeepfakeBench detectors build on. DeepfakeBench's weights were trained on
      FaceForensics++ (c23 per the README; upstream issue 151, asking whether every checkpoint is
      c23, is unanswered) after ImageNet pretraining. Some users report the released weights do not
      reproduce DeepfakeBench's README table.
  xlsr_aasist:
    why: >-
      The same training data as AASIST on a backbone pretrained on 128 languages: whether
      multilingual pretraining alone, with English-only fakes, carries over to South Asian speech.
      The foundation-model half of the probe's audio pair.
    s2_id: ARXIV:2202.12233
    venue: Odyssey 2022
    published:
      - {test: "ASVspoof 2021 LA eval", metric: EER, value: "0.82%", source: paper, cite: "Table 3, best run; 3-seed mean 1.00%"}
      - {test: "ASVspoof 2021 DF eval", metric: EER, value: "2.85%", source: paper, cite: "Table 3, best run with DF-tuned augmentation"}
    summary: >-
      Fine-tuned XLS-R 300M front end with an AASIST graph-attention back end on its last layer; trained
      on ASVspoof 2019 LA only.
    architecture: >-
      Raw 16 kHz waveform in 64,600-sample windows, fine-tuned XLS-R 300M front end, AASIST graph
      attention back end on the last layer, two-way classifier
    description: >-
      XLS-R + AASIST (Tak et al., Odyssey 2022) fine-tunes the SSL front end jointly with an AASIST
      back end. The front end was pretrained on real speech only (Common Voice, BABEL, MLS, VoxPopuli,
      VoxLingua107) and the detector trained on the ASVspoof 2019 LA training split alone, so with
      no MLAAD or FLEURS in training it is a clean zero-shot probe on South Asian sets. The adapter
      replaces fairseq and passes parity against upstream's own stack (2026-10-12).
  xlsr_mamba:
    why: >-
      The same backbone and training as XLS-R + AASIST with a Mamba back end, so a failure the two
      share on South Asian speech points at the training data, not the head. Second tier.
    s2_id: ARXIV:2411.10027
    venue: IEEE SPL 2024
    published:
      - {test: "ASVspoof 2021 LA eval", metric: EER, value: "0.93%", source: paper, cite: "Tables I and II, DuaBiMamba"}
      - {test: "ASVspoof 2021 DF eval", metric: EER, value: "1.88%", source: paper, cite: "Tables I and II, DuaBiMamba"}
      - {test: "In-the-Wild", metric: EER, value: "6.71%", source: paper, cite: "Table III", evalset: in_the_wild}
    summary: >-
      Fine-tuned XLS-R 300M features read by a dual-column bidirectional Mamba back end instead of
      attention; trained on ASVspoof 2019 LA only.
    architecture: >-
      Raw 16 kHz waveform in 64,600-sample windows, fine-tuned XLS-R 300M front end, dual-column bidirectional
      Mamba back end (six blocks per direction), two-way classifier
    description: >-
      XLSR-Mamba (Xiao and Das, IEEE SPL 2024) replaces the attention back end with forward and backward
      Mamba state space blocks over XLS-R features. The front end was pretrained on real speech (Common
      Voice, BABEL, MLS, VoxPopuli, VoxLingua107) and the released network trained on the ASVspoof
      2019 LA training split alone. Here mamba-ssm's CUDA kernels are replaced by slower pure-PyTorch
      stand-ins, and parity against the kernels is not checked yet.
  xlsr_sls:
    why: >-
      The same backbone and training as XLS-R + AASIST with a back end that pools every layer, so a
      failure the two share on South Asian speech points at the training data, not the head. Second
      tier.
    s2_id: DOI:10.1145/3664647.3681345
    venue: ACM MM 2024
    published:
      - {test: "ASVspoof 2021 DF eval", metric: EER, value: "1.92%", source: repo README, cite: "SLSforADD, results using pre-trained model"}
      - {test: "ASVspoof 2021 LA eval", metric: EER, value: "2.87%", source: repo README, cite: "SLSforADD, results using pre-trained model"}
      - {test: "In-the-Wild", metric: EER, value: "7.46%", source: repo README, cite: "SLSforADD, results using pre-trained model", evalset: in_the_wild}
    summary: >-
      Fine-tuned XLS-R 300M with learned attention pooling over all 24 layers (Sensitive Layer Selection)
      and a small MLP; ASVspoof 2019 LA only.
    architecture: >-
      Raw 16 kHz waveform in 64,600-sample windows, fine-tuned XLS-R 300M front end, learned attention
      over all 24 layers (SLS), two linear layers, two-way classifier
    description: >-
      XLS-R + SLS (Zhang et al., ACM Multimedia 2024) weights every XLS-R layer with learned attention,
      since different layers carry different spoofing cues, before two linear layers. The front end
      was pretrained on real speech (Common Voice, BABEL, MLS, VoxPopuli, VoxLingua107) and the network
      trained on the ASVspoof 2019 LA training split alone, making it a clean zero-shot probe on every
      South Asian set. The repository declares no licence, so its code is imported, never copied;
      parity is not checked yet.
datasets:
  asvspoof2019_la:
    why: >-
      Not South Asian. The reproduction set for the detectors trained on it: an adapter must match
      its published numbers here, and settle its score direction, before its South Asian numbers
      count, so a low South Asian AUC reads as a real failure rather than a flipped sign.
    s2_id: DOI:10.1016/j.csl.2020.101114
    venue: CSL 2020
    summary: >-
      English VCTK speech, bona fide plus 19 TTS and voice-conversion attacks; the standard logical-access
      anti-spoofing benchmark.
    scale: 7.6 GB; train, dev and eval with disjoint speakers
    generators:
    - >-
      19 attack systems A01 to A19: text-to-speech, voice conversion, and TTS output passed through
      voice conversion (A13 to A15)
    annotations:
    - speaker id
    - 'attack id: A01 to A19 (TTS, VC or TTS+VC)'
    - 'official split: train, dev, eval (disjoint speakers)'
    format: FLAC, 16 kHz, 16-bit (VCTK downsampled)
    notes: Train and dev share attacks A01 to A06; most eval attacks are unseen in training.
  bangla_voices:
    why: >-
      Bangladeshi Bengali with every fake paired to the same speaker's real clip and a gender label,
      so it separates the fake from speaker and recording differences and gives the gender
      comparison.
    summary: >-
      Bangla read speech from 75 Bangladeshi speakers, each of 30 sentences read once and faked once,
      so every fake has a real twin.
    scale: 4,500 clips, 2 to 5 s each
    annotations:
    - speaker id (75 speakers)
    - 'gender: male, female (from the speaker folder)'
    - 'sentence set: 15 sets of 30 sentences'
    - 'real/fake twin: every fake has a real clip by the same speaker and sentence'
    format: WAV, 2 to 5 s clips
    notes: The record never names the tool that made the fakes.
  banglafake:
    why: >-
      The largest open Bengali set, with sub-corpora recorded in different ways, so results can be
      split by recording condition.
    s2_id: ARXIV:2505.10885
    venue: arXiv 2025
    summary: >-
      Bengali real speech and VITS text-to-speech fakes in three sub-corpora (sust, mozilla, news).
    scale: 13,796 real and 12,796 fake clips
    generators:
    - VITS (text-to-speech)
    annotations:
    - 'sub-corpus: sust, mozilla, news'
    - speaker id (mozilla sub-corpus only, five Common Voice speakers)
    - transcript
    format: WAV, 22.05 kHz, 6 to 7 s clips
    notes: >-
      The news sub-corpus is real only, and the archive's counts differ from the README's.
  bd_grf6:
    why: >-
      Bangladeshi speech with a third-gender group, which Bangladesh, India, Nepal and Pakistan
      recognise in law: the only set that tests gender beyond male and female. Cross-corpus until
      its file formats are checked, since they may give the label away.
    summary: >-
      Bangla real and fake speech by Bangladeshi speakers, grouped male, female and third gender;
      the only set with a third-gender group.
    scale: 13,566 clips, 18.7 h
    annotations:
    - 'gender: male, female, third gender'
    format: WAV and MP3 (format differs by class)
    notes: >-
      Third-gender real clips are MP3 while female fakes are WAV, so file format can leak the label.
  casual_conversations_v2:
    why: >-
      Real video only, with India its largest country and self-reported demographics: how often
      detectors flag real South Asian faces as fake, the harm that falls on real people.
    s2_id: ARXIV:2303.04838
    venue: CVPRW 2023
    summary: >-
      Real video only: consenting participants in seven countries (India the largest), with self-reported
      and annotated demographics; for false positives on real faces.
    scale: 5,567 participants
    generators: []
    annotations:
    - participant id
    - age (self-reported)
    - gender (self-reported)
    - language and dialect (self-reported)
    - country and region
    - disability, adornments and physical attributes (self-reported)
    - 'skin tone: Fitzpatrick and Monk scales (annotated)'
    - voice timbre (annotated)
    - 'recording setup: scripted or unscripted'
    - per-second activity labels
    format: video, 26,467 recordings, about 674 h in all
    notes: Real videos only; some labels are licensed for evaluation use only.
  celeb_df_v2:
    why: >-
      Not South Asian (mostly Caucasian subjects). A video reproduction set: it or FF++ settles
      every video model's score direction, without which no video number counts.
    s2_id: ARXIV:1909.12962
    venue: CVPR 2020
    summary: >-
      Celebrity face-swap videos from YouTube made with an improved DeepFake synthesis process; a
      standard cross-dataset video test.
    scale: 890 real and 5,639 fake videos
    generators:
    - DeepFake face swap with the authors' improved synthesis process
    annotations:
    - 'source folder: Celeb-real, YouTube-real, Celeb-synthesis'
    - official test list (518 videos)
    format: MP4
    notes: About 88% of subjects are Caucasian, so it carries no South Asian signal.
  deepfake_eval_2024:
    why: >-
      Picked as the only set of deepfakes that actually circulated online. It has no country field,
      so South Asian items can't be picked out, and access requests are often rejected.
    cut: true
    s2_id: ARXIV:2503.02857
    venue: arXiv 2025
    summary: >-
      In-the-wild real and fake video, audio and images collected from social media in 2024, in 52
      languages.
    scale: 20.3 GB
    generators:
    - >-
      in the wild, unknown tools; manipulation types include lip-sync, face swap and diffusion (per
      the paper)
    annotations:
    - 'media type: video, audio, image'
    - language (Whisper-detected, per the paper)
    - source website (per the paper)
    - manipulation type (per the paper)
    format: >-
      video about 30 fps, average 576 x 720 px, about 80 s average; audio about 44.7 kHz, about 115
      s average; images mostly 1024 x 1024
    notes: >-
      Evaluation only, no training on it; its metadata columns are unverified until access is granted.
  deephy:
    why: >-
      Indian face swaps with up to three successive generators, so South Asian faces under several
      generators. With few real videos it measures misses more than false alarms.
    s2_id: ARXIV:2209.09111
    venue: IJCB 2022
    summary: >-
      Face-swap videos with one to three successive swaps (FaceShifter, FaceSwap, FSGAN), for attributing
      the sequence of generators.
    scale: 100 real and 5,040 fake videos
    generators:
    - FaceShifter
    - FaceSwap
    - FSGAN
    annotations:
    - 'swap succession: one, two or three successive swaps'
    - sequence of generators used
    - gender
    - age group
    - skin tone
    - facial hair, spectacles, shades, mic and head or hair occlusion attributes
    format: MP4, 720p, 25 fps, about 20 s
    notes: Only 100 real videos against 5,040 fakes.
  dfplatter:
    why: >-
      The largest Indian video set, labelled by skin tone, gender, age and occlusion: where skin-
      tone effects on South Asian faces can be measured directly.
    s2_id: f1a9f5f42a68a8b5ee07e06dee800629fccc533f
    venue: CVPR 2023
    summary: >-
      Indian face-swap videos (FSGAN, FaceShifter, FaceSwap), single- and multi-subject, labelled
      by gender, age, skin tone and occlusion.
    scale: 133,260 videos, over 500 GB
    generators:
    - FSGAN
    - FaceShifter
    - FaceSwap
    annotations:
    - 'set: A (single subject), B and C (multiple subjects)'
    - gender
    - age
    - Fitzpatrick skin tone
    - occlusion
    - 'resolution: low or high'
    - 'compression: c0, c23, c40'
    format: videos at low and high resolution, c0, c23 and c40 compression
    notes: Its licence limits use to research colleagues at the signing institution.
  fakeavceleb:
    why: >-
      The only set with a South Asian group beside four other ethnic groups under one recording
      setup, so it gives the probe's South Asian against others comparison. Its speech is English.
    s2_id: ARXIV:2108.05080
    venue: NeurIPS D&B 2021
    summary: >-
      VoxCeleb2 celebrity videos with fake video, fake audio or both, across five ethnic groups including
      100 South Asian real videos.
    scale: 500 real and 19,500 fake videos
    generators:
    - FaceSwap (video)
    - FSGAN (video)
    - Wav2Lip (lip-sync)
    - SV2TTS (voice cloning)
    annotations:
    - >-
      category: RealVideo-RealAudio, RealVideo-FakeAudio, FakeVideo-RealAudio, FakeVideo-FakeAudio
      (which track is fake)
    - >-
      ethnicity: African, Asian (East), Asian (South), Caucasian (American), Caucasian (European)
    - gender
    - subject id
    - generation method
    format: MP4 from VoxCeleb2, about 7.8 s on average
    notes: >-
      Ethnicity and gender come from the folder layout, which is unverified until a copy arrives.
  ffpp:
    why: >-
      Not South Asian. Every video detector here trained on it, so its test split is where video
      adapters reproduce published numbers and settle score direction.
    s2_id: ARXIV:1901.08971
    venue: ICCV 2019
    summary: >-
      1,000 real YouTube videos and their fakes from face-swap and face-reenactment methods; the standard
      video training set and in-domain test.
    scale: 1,000 real videos plus fakes, about 40 GB
    generators:
    - Deepfakes
    - Face2Face
    - FaceSwap
    - NeuralTextures
    - FaceShifter
    annotations:
    - manipulation method
    - target id and source id of each fake
    - 'official split: train, val, test (JSON pair lists)'
    - binary manipulation masks
    format: MP4, c23 compression used here (raw and c40 also exist)
    notes: Real videos come from 977 YouTube videos, mostly frontal faces.
  hidf:
    why: >-
      Not South Asian, but race-labelled with an Indian group: a stopgap check of false alarms on
      real faces by race until South Asian video arrives. Its Indian group is small, so it should
      step back once FakeAVCeleb or DF-Platter is in.
    s2_id: DOI:10.1145/3711896.3737399
    venue: KDD 2025
    summary: >-
      Commercial-tool face swaps selected because people cannot tell them from real, with race labels
      including an Indian group.
    scale: 4,361 real and 4,361 fake videos
    generators:
    - commercial face-swap tools (which tool made which video is not stated)
    annotations:
    - base video id
    - donor face id
    - 'race: White, Asian, Latino, Black, Indian'
    - gender
    - 'age: adult, child, elderly'
    format: MP4 with audio, 512 px face crops, about 3 s
    notes: Clips are too short for HAVIC's 3.2 s windows, and the 62k images are not fetched.
  iav_df:
    why: >-
      Picked because it is Indian lip-sync with cloned voices, exactly v1's type. Dropped: its only
      sample link is dead.
    summary: >-
      Indian audio-video deepfakes: motion-model reenactment, face swaps and Wav2Lip lip-sync with
      cloned voices.
    generators:
    - First Order Motion Model
    - Thin Plate Spline Motion Model
    - FaceApp face swap
    - Wav2Lip lip-sync with cloned voices
    notes: Only a sample was ever released and its link is dead, so nothing can be downloaded.
  in_the_wild:
    why: >-
      Not South Asian. Real-world English deepfakes of public figures: the reproduction set where
      the guard refuses ASVspoof (DF Arena, AntiDeepfake), and the out-of-domain reference South
      Asian scores are compared with.
    s2_id: ARXIV:2203.16263
    venue: Interspeech 2022
    summary: >-
      Real and fake English speech of public figures collected from the internet; the standard out-of-domain
      audio test.
    scale: 31,779 clips (19,963 real, 11,816 fake)
    annotations:
    - speaker (public figure name)
    format: WAV, 37.9 h in all (20.7 h real, 17.2 h fake)
    notes: meta.csv lists 54 speakers while the card says 58 celebrities and politicians.
  indeepfake:
    why: >-
      Indian YouTube video in seven languages with face swaps and TTS plus Wav2Lip lip-sync: South
      Asian talking heads with cloned voices, close to v1's type.
    s2_id: DOI:10.1016/j.patrec.2025.07.002
    venue: Pattern Recognition Letters 2025
    summary: >-
      Indian YouTube videos in seven languages with face swaps and text-to-speech plus Wav2Lip lip-sync
      fakes.
    scale: 389 real and 4,680 fake videos
    generators:
    - FSGAN
    - FaceSwap
    - DeepFaceLab
    - text-to-speech plus Wav2Lip lip-sync
    annotations:
    - 'language: English, Hindi, Bengali, Telugu, Tamil, Punjabi, Rajasthani'
    - gender
    - age group
    format: video excerpts of about 10 to 12 s from YouTube
    notes: Access is restricted to academic institutions on request.
  indic_codecfake:
    why: >-
      Picked as Indian-language fakes from neural audio codecs, a kind of fake no other set covers.
      Dropped: no download exists.
    s2_id: ARXIV:2604.19949
    venue: ACL 2026 Findings
    summary: >-
      Fakes made by re-encoding IndicSUPERB speech in 12 Indian languages with neural audio codecs
      (DAC, Encodec).
    generators:
    - DAC neural audio codec (16, 24 and 44 kHz)
    - Encodec neural audio codec (24 and 48 kHz)
    annotations:
    - language (12 Indic languages)
    notes: No download exists yet; its real side is IndicSUPERB.
  indicsuperb:
    why: >-
      Real read speech in 12 Indian languages from the speakers IndicSynth clones, so IndicSynth's
      evalsets pair each fake with real speech from the same speakers and corpus.
    s2_id: ARXIV:2208.11761
    venue: AAAI 2023
    summary: >-
      Real read speech in 12 Indian languages (Kathbath); the real counterpart for IndicSynth, sharing
      its speaker ids.
    scale: 5.8 GB (test splits)
    generators: []
    annotations:
    - speaker id (shared with IndicSynth)
    - 'gender: male, female'
    - language (12)
    - 'split: test_known, test_unknown'
    - transcript
    format: m4a
    notes: Only the clean test splits are fetched; the 85 GB train split is left out.
  indicsynth:
    why: >-
      The largest open South Asian fake speech, with voice conversion (FreeVC24) beside TTS: the
      cloned-voice half of v1, with generator and gender labels.
    s2_id: DOI:10.18653/v1/2025.acl-long.1070
    venue: ACL 2025
    summary: >-
      Fake-only speech in 12 Indian languages from XTTS-v2, VITS and FreeVC24, cloning IndicSUPERB
      speakers.
    scale: 4,000 h, 989 target speakers, 845 GB
    generators:
    - XTTS-v2 (text-to-speech)
    - VITS (text-to-speech)
    - FreeVC24 (voice conversion)
    annotations:
    - generator
    - target speaker id (Kathbath numbering)
    - source speaker id (voice conversion only)
    - 'gender: male, female'
    - language (12)
    - source and target reference audio
    - TTS transcript
    format: WAV embedded in parquet rows
    notes: >-
      Fake only; real speech comes from IndicSUPERB. Shards are sorted by generator, so small samples
      may miss some.
  indictts_challenge:
    why: >-
      Sixteen Indian languages and the only labelled Nepali fakes in one set, so it is where
      language becomes a per-group attribute.
    summary: >-
      Real and text-to-speech clips in 16 Indian languages, including Nepali, from a Hugging Face
      community challenge.
    scale: 31,102 labelled training clips, 17.4 GB
    annotations:
    - language (16)
    - transcript
    - speaker code and gender (from the id)
    - emotion (from the id)
    - 'official split: train, test (test labels hidden)'
    format: 16 kHz audio embedded in parquet rows
    notes: The card names neither the TTS system nor where the real speech comes from.
  indiefake:
    why: >-
      Indian-accented English with voices cloned across speakers: voice-cloning scams in the English
      South Asian public figures often speak.
    s2_id: ARXIV:2506.19014
    venue: arXiv 2025
    summary: >-
      Indian-accented English from 50 speakers: real recordings and voice-cloned fakes of hypothetical,
      same-speaker and cross-speaker transcripts.
    scale: 27.17 h
    generators:
    - voice cloning with tools such as Amazon Polly, Play.ht or ElevenLabs
    annotations:
    - speaker id (50 speakers)
    - 'gender: 38 male, 12 female'
    - age group (18 to 75)
    - 'background: celebrity, politician, academic, businessman, member of the public'
    - region and accent
    - 'transcript type: hypothetical, same-speaker, cross-speaker'
    - official 80/20 subject-independent train/test split
    format: WAV, 16 kHz, about 5 s on average
    notes: Indian-accented English only, no South Asian languages.
  lrlspoof:
    why: >-
      More Nepali and Assamese fakes from 24 TTS systems, where Nepali data is thinnest. Deferred:
      no language can be fetched without the whole 462 GB archive.
    s2_id: ARXIV:2603.02364
    venue: Interspeech 2026 (arXiv)
    summary: >-
      Fake-only speech in 66 low-resource languages, including Nepali and Assamese, from 24 open-source
      TTS systems; deferred.
    scale: 1.3 million utterances, 462 GB
    generators:
    - 24 open-source text-to-speech systems
    annotations:
    - language (66)
    - TTS model (from the folder)
    format: WAV, shipped as one gzipped tarball in 47 parts
    notes: Spoof only, and no language can be fetched without the whole 462 GB archive.
  mavos_dd_hi:
    why: >-
      The only South Asian video anyone can download: Hindi talking heads, face swaps and voice
      conversion, so it is the first test of v1's lip-sync with cloned voices, and HAVIC's only
      South Asian set.
    s2_id: ARXIV:2505.11109
    venue: arXiv 2025
    summary: >-
      Hindi YouTube videos and fakes from eight face-swap, talking-head, reenactment and voice-conversion
      generators; our one downloadable South Asian audio-video set.
    scale: 3,632 real and 3,881 fake videos
    generators:
    - inswapper (face swap)
    - hififace (face swap)
    - roop (face swap)
    - echomimic (talking head)
    - sonic (talking head)
    - memo (talking head)
    - liveportrait (reenactment)
    - knnvc (voice conversion)
    annotations:
    - generator
    - 'which track was manipulated: video, audio'
    - 'language: Hindi'
    - open-set split (per the paper)
    format: MP4, 256 x 256 to 1920 x 1080, 23 to 60 fps, audio 16 to 44.1 kHz
    notes: >-
      The paper says face swaps keep their source audio, but the repo leaves the audio label of non-knnvc
      fakes null until the metadata confirms it.
  mendeley_roop_akool:
    why: >-
      Bangladeshi and Indian face crops faked with consumer tools: a pipeline test, used for video
      parity checks, never for results.
    summary: >-
      Face-crop frames of Bangladeshi and Indian people, real and faked with Roop and Akool.
    scale: 3,746 real and 106,948 fake frames
    generators:
    - Roop
    - Akool
    annotations:
    - 'technique: Tech-1, Tech-2 (which is Roop and which Akool is not stated)'
    - source video
    - name of the person swapped in (file name)
    format: JPEG face crops, 500 x 500, frames taken at 5 fps
    notes: >-
      Pipeline test only, never reported; frames of one video are near-duplicates, so never split
      them across train and test.
  mlaad:
    why: >-
      The only Sinhala deepfake speech anywhere, plus Hindi, Bengali, Tamil and Urdu. Fake only, so
      its evalsets are cross-corpus and diagnostic until the shortcut probe clears them.
    s2_id: ARXIV:2401.09512
    venue: IJCNN 2024
    summary: >-
      Fake-only text-to-speech in many languages (Hindi, Bengali, Tamil, Urdu, Sinhala and more),
      synthesised from M-AILABS source text.
    scale: 1,000 clips per language and generator, 9.5 GB
    generators:
    - >-
      text-to-speech systems, one folder each (Hindi 9, Bengali 4, Kannada 2, one each for Tamil,
      Marathi, Urdu, Sinhala, Malayalam)
    annotations:
    - generator
    - language
    - original M-AILABS source file
    - duration
    format: WAV
    notes: >-
      Fake only; real speech must come from another corpus, so every evalset on it is cross-corpus.
  openslr_sinhala:
    why: >-
      Real Sinhala read speech, the real half for MLAAD's Sinhala fakes: the only way to test Sri
      Lanka's main language today.
    s2_id: DOI:10.21437/SLTU.2018-11
    venue: SLTU 2018
    summary: >-
      Google's crowd-sourced Sinhala read speech, real only; the real half for MLAAD's Sinhala fakes.
    scale: 11,550 clips used (full set 185k utterances)
    generators: []
    annotations:
    - anonymised speaker id
    - transcript
    format: FLAC
    notes: No gender labels, and only the first of 16 zips is fetched.
  sea_spoof:
    why: >-
      Hindi and Tamil fakes from named commercial voice tools as well as open TTS, the kind of tools
      behind real scams.
    s2_id: ARXIV:2509.19865
    venue: arXiv 2025
    summary: >-
      Real and fake speech in seven languages (Hindi and Tamil used here) from six open TTS systems
      and four commercial voice tools.
    scale: Hindi 71,171 and Tamil 49,640 utterances
    generators:
    - VITS-MMS
    - FastSpeech2
    - Indic-TTS
    - F5-TTS
    - Tacotron2
    - FastPitch
    - HeyGen (commercial)
    - ElevenLabs (commercial)
    - MiniMax (commercial)
    - GPT-4o-mini-TTS (commercial)
    annotations:
    - language
    - spoof type
    - source model
    - source dataset
    - speaker or voice
    - 'category: offline or online spoof'
    - 'official split: train, validation, test (8:1:1)'
    format: FLAC, 16 kHz, in parquet shards
    notes: The schema comes from the card and paper; nobody on the team has seen the files yet.
  speechfake:
    why: >-
      More Indic fakes (Hindi, Bengali, Tamil, Marathi, Malayalam) from a free, widely used TTS and
      from voice conversion. Cross-corpus, so diagnostic until the shortcut probe.
    s2_id: ARXIV:2507.21463
    venue: ACL 2025
    summary: >-
      Multilingual real and fake speech; we use Hindi, Bengali, Tamil, Marathi and Malayalam, faked
      mostly with Edge-TTS, plus SeedVC for Hindi.
    scale: 143 GB for the South Asian parts
    generators:
    - Edge-TTS (text-to-speech)
    - SeedVC (voice conversion, Hindi only)
    annotations:
    - generator
    - language
    - Edge-TTS voice name
    - Common Voice split folder (real clips)
    format: WAV, 16 kHz mono, mostly 2 to 20 s
    notes: >-
      The paper promises transcripts and voice ids, but the metadata CSVs we read carry only label,
      generator kind, model and language.
  svarah:
    why: >-
      Real Indian-accented English from across India with gender, age, state and first language:
      false alarms on real South Asian voices, split by region.
    s2_id: ARXIV:2305.15760
    venue: Interspeech 2023
    summary: >-
      Real Indian-accented English from 117 speakers across India, labelled by gender, age, state
      and first language; for false positives.
    scale: 9.6 h, 117 speakers
    generators: []
    annotations:
    - speaker id
    - gender
    - age group
    - native state and district
    - first language
    - transcript
    format: audio embedded in parquet, test split only
    notes: No licence is declared, so nothing derived from it is published yet.
  unidatapro_videos:
    why: >-
      A tiny free preview of phone videos and their face swaps: a pipeline test, never reported.
    summary: >-
      Free preview: five real phone videos and five face-swap fakes made from them.
    scale: 10 videos, about 68 MB
    generators:
    - aisaver.io
    - faceswapvideo.ai
    - magichour.ai (which service made which fake is not stated)
    annotations:
    - pairing of real video, fake and source face image (CSV)
    format: MP4 and MOV phone videos with audio, 480p to 1080p
    notes: Pipeline test only, never reported; whether the fakes keep the original audio is unknown.
  urdu_csalt:
    why: >-
      Pakistan's Urdu with generator labels (VITS, Tacotron), the first South Asian set scored. It
      behaves unlike the others, which makes it the test case for recording artefacts.
    s2_id: DOI:10.18653/v1/2024.findings-acl.861
    venue: ACL 2024 Findings
    summary: >-
      Urdu speech from 17 speakers: real clips and matched fakes from two TTS systems (VITS and Tacotron).
    scale: 6,794 clips (3,398 real, 3,396 fake)
    generators:
    - VITS (text-to-speech)
    - Tacotron (text-to-speech)
    annotations:
    - speaker id (17 speakers)
    - generator
    - 'bona fide part: Part 1, Part 2'
    format: WAV
    notes: >-
      This release has 6,794 clips, far fewer than the paper's 20,451 real and 16,830 fake utterances.
