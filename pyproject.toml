[project]
name = "deeptrace-bench"
version = "0.1.0"
description = "Benchmark harness for deepfake detectors on South Asian datasets"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gdown>=5.2",
    "huggingface-hub>=0.34,<1.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "safetensors>=0.4",
    "scikit-learn>=1.5",
    "soundfile>=0.12",
    "soxr>=0.5",
    "timm>=1.0.20",
    "torch>=2.8,<2.9",
    "torchvision>=0.23,<0.24",
    "transformers>=4.56,<4.57",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
# Only the platforms we run on: Curnagl's x86 GPU partitions and Apple Silicon laptops.
# Leaving out aarch64 Linux keeps the GH200 nodes (and their wheel gaps) out of the lock.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# CUDA 12.8 wheels cover A100, L40S and H100. macOS takes the PyPI (CPU/MPS) build.
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
